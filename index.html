<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cartas del Quinto Sol</title>
    <meta name="description" content="Duelos de fusión de cartas con mitología mexica. Juega gratis en tu celular o PC, contra la máquina o contra tus amigos." />
    <meta name="theme-color" content="#14110f" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quinto Sol" />
    <!-- Vista previa al compartir el link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SeaKingsStudios" />
    <meta property="og:title" content="Cartas del Quinto Sol" />
    <meta property="og:description" content="Duelos de fusión de cartas con mitología mexica. Juega gratis contra la máquina o contra tus amigos." />
    <meta property="og:url" content="https://cartas.seakingsstudios.com/" />
    <meta property="og:image" content="https://cartas.seakingsstudios.com/icon-512.png" />
    <!-- La letra Cinzel va dentro del juego (no de Google Fonts): así abre sin esperar a otro sitio -->
    <style>
      html, body { margin: 0; background: #14110f; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        color: #c9b79c; font: 16px system-ui, sans-serif; }
      .boot__sun { font-size: 84px; color: #f2c12e; text-shadow: 0 0 30px rgb(242 193 46 / .5); animation: boot-spin 6s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Se ve al instante mientras carga el juego (antes parecía que la app no abría) -->
    <div id="app"><div class="boot" role="status"><div class="boot__sun" aria-hidden="true">✺</div><div>Cartas del Quinto Sol · cargando…</div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
